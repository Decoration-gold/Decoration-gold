<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Decoration Gold INC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f7ead8;
            background-image:
                linear-gradient(
                    rgba(255, 250, 242, 0.16),
                    rgba(255, 250, 242, 0.16)
                ),
                url("logo.PNG");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #111111;
        }

        .encabezado {
            min-height: 82px;
            padding: 12px 28px;

            display: grid;
            grid-template-columns: 260px 1fr 260px;
            align-items: center;
            gap: 20px;

            background: linear-gradient(
                90deg,
                #080808,
                #151515,
                #080808
            );

            border-bottom: 1px solid #b98a2e;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .marca-logo {
            width: 190px;
            height: 58px;
            object-fit: cover;
            object-position: center;
            border-radius: 8px;
        }

        .nombre-negocio {
            margin: 0;
            text-align: center;
            color: #d5a94e;
            font-size: clamp(25px, 3vw, 38px);
            font-weight: 700;
            letter-spacing: 0.4px;
            text-shadow: 0 1px 6px rgba(213, 169, 78, 0.25);
        }

        .usuario {
            justify-self: end;
            min-width: 170px;
            padding: 12px 18px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            color: #d9ad52;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #9e782d;
            border-radius: 12px;

            font-size: 17px;
            cursor: pointer;
        }

        .contenido {
            min-height: calc(100vh - 82px);
            padding: 12px 24px 50px;
            position: relative;
        }

        .contenido::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 247, 236, 0.08);
            pointer-events: none;
        }

        .subtitulo {
            position: relative;
            z-index: 1;

            margin: 0;
            padding: 2px 0 26px;

            text-align: center;
            color: #555555;
            font-size: clamp(20px, 2.3vw, 28px);
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
        }

        .menu {
            position: relative;
            z-index: 1;

            display: grid;
            grid-template-columns: repeat(5, minmax(180px, 1fr));
            gap: 22px;

            max-width: 1500px;
            margin: 0 auto;
        }

        .tarjeta {
            min-height: 190px;
            padding: 24px 16px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: #111111;

            background: rgba(255, 255, 255, 0.93);
            border: 1px solid rgba(188, 151, 76, 0.22);
            border-radius: 18px;

            box-shadow:
                0 8px 22px rgba(43, 30, 12, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);

            cursor: pointer;
            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;
        }

        .tarjeta:hover,
        .tarjeta:focus {
            transform: translateY(-5px);
            border-color: #c79b43;
            box-shadow:
                0 13px 30px rgba(43, 30, 12, 0.23),
                0 0 0 2px rgba(199, 155, 67, 0.12);
            outline: none;
        }

        .icono {
            margin-bottom: 14px;
            font-size: 55px;
            line-height: 1;
            filter: sepia(0.25) saturate(1.15);
        }

        .titulo {
            font-size: 24px;
            font-weight: 700;
        }

        .configuracion {
            grid-column: 1;
        }

        @media (max-width: 1150px) {
            .encabezado {
                grid-template-columns: 200px 1fr 200px;
                padding-left: 18px;
                padding-right: 18px;
            }

            .marca-logo {
                width: 165px;
                height: 52px;
            }

            .menu {
                grid-template-columns: repeat(3, minmax(190px, 1fr));
            }
        }

        @media (max-width: 760px) {
            body {
                background-attachment: scroll;
                background-size: auto 100%;
            }

            .encabezado {
                grid-template-columns: 1fr auto;
                min-height: auto;
                padding: 12px 14px;
            }

            .marca {
                display: none;
            }

            .nombre-negocio {
                text-align: left;
                font-size: 24px;
            }

            .usuario {
                min-width: auto;
                padding: 10px 12px;
                font-size: 15px;
            }

            .contenido {
                padding: 14px 15px 36px;
            }

            .subtitulo {
                padding-bottom: 18px;
                font-size: 20px;
            }

            .menu {
                grid-template-columns: repeat(2, minmax(140px, 1fr));
                gap: 14px;
            }

            .tarjeta {
                min-height: 150px;
                padding: 18px 10px;
                border-radius: 15px;
            }

            .icono {
                font-size: 43px;
            }

            .titulo {
                font-size: 19px;
            }
        }

        @media (max-width: 430px) {
            .nombre-negocio {
                font-size: 20px;
            }

            .usuario span:last-child {
                display: none;
            }

            .menu {
                grid-template-columns: 1fr;
            }

            .configuracion {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <header class="encabezado">

        <div class="marca">
            <img
                class="marca-logo"
                src="logo.PNG"
                alt="Logo de Decoration Gold"
            >
        </div>

        <h1 class="nombre-negocio">
            Decoration Gold INC
        </h1>

        <button class="usuario" type="button">
            <span>♙</span>
            <span>Administrador</span>
            <span>⌄</span>
        </button>

    </header>

    <main class="contenido">

        <h2 class="subtitulo">
            Sistema Administrativo
        </h2>

        <section class="menu">

            <a class="tarjeta" href="inventario.html">
                <div class="icono">📦</div>
                <div class="titulo">Inventario</div>
            </a>

            <a class="tarjeta" href="ventas.html">
                <div class="icono">💳</div>
                <div class="titulo">Ventas</div>
            </a>

            <a class="tarjeta" href="compras.html">
                <div class="icono">🛒</div>
                <div class="titulo">Compras</div>
            </a>

            <a class="tarjeta" href="gastos.html">
                <div class="icono">💵</div>
                <div class="titulo">Gastos</div>
            </a>

            <a class="tarjeta" href="reportes.html">
                <div class="icono">📊</div>
                <div class="titulo">Reportes</div>
            </a>

            <a class="tarjeta configuracion" href="configuracion.html">
                <div class="icono">⚙️</div>
                <div class="titulo">Configuración</div>
            </a>

        </section>

    </main>
</body>
</html>

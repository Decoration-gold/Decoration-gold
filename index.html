    <style>
        :root {
            --negro: #070707;
            --negro-suave: #171717;
            --dorado: #d4a83f;
            --dorado-claro: #f0cf7a;
            --crema: #f7efe2;
            --texto: #171717;
            --verde: #16894a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--texto);

            background-color: #f7efe2;

            background-image:
                radial-gradient(
                    circle at 12% 18%,
                    rgba(255, 255, 255, 0.96) 0,
                    rgba(255, 255, 255, 0.58) 17%,
                    transparent 37%
                ),
                radial-gradient(
                    circle at 85% 22%,
                    rgba(222, 185, 111, 0.15) 0,
                    transparent 31%
                ),
                radial-gradient(
                    circle at 43% 77%,
                    rgba(255, 255, 255, 0.83) 0,
                    transparent 39%
                ),
                repeating-linear-gradient(
                    118deg,
                    transparent 0,
                    transparent 115px,
                    rgba(185, 137, 48, 0.075) 117px,
                    rgba(218, 177, 92, 0.16) 120px,
                    transparent 124px,
                    transparent 245px
                ),
                linear-gradient(
                    135deg,
                    #fffaf2 0%,
                    #f3e4cf 38%,
                    #fffaf3 66%,
                    #ead2ad 100%
                );

            background-attachment: fixed;
        }

        .encabezado {
            min-height: 116px;
            padding: 13px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            position: relative;
            z-index: 20;

            background:
                linear-gradient(
                    90deg,
                    #050505 0%,
                    #151515 50%,
                    #050505 100%
                );

            border-top: 2px solid var(--dorado);
            border-bottom: 2px solid var(--dorado);

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.28);
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-redondo {
            width: 78px;
            height: 78px;

            flex-shrink: 0;

            object-fit: cover;
            object-position: center;

            border-radius: 50%;
            border: 3px solid var(--dorado);

            background: #111111;

            box-shadow:
                0 0 0 3px rgba(212, 168, 63, 0.14),
                0 0 19px rgba(231, 184, 74, 0.55);
        }

            margin: 0;

            color: var(--dorado-claro);

            font-family:
                Georgia,

                serif;

            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.05;
            text-transform: uppercase;
        }

        .marca-texto p {
            margin: 7px 0 0;

            color: var(--dorado);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }
